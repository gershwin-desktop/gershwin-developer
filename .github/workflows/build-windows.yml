name: Build Gershwin System (Windows)

# Builds the Gershwin System Domain for Windows: the patched GNUstep stack
# (libobjc2, tools-make, libs-base, libs-gui, libs-back with the win32 server)
# and the Workspace, inside an MSYS2 MINGW64 shell with the mingw-w64 clang
# toolchain. Same scripts as the Unix builds: bootstrap.sh installs the
# packages from Library/OSSupport/windows.txt, checkout.sh clones and pins the
# sources, install-system-domain.sh builds into /System (a directory inside
# the MSYS2 root). No X11, D-Bus, libdispatch or libs-av on Windows.

on:
  push:
    branches: [main, dev, windows]
  pull_request:
  workflow_dispatch:

env:
  # The Windows port of the Gershwin repositories lives on their "windows"
  # branches until it lands in dev: checkout.sh uses that branch wherever a
  # repository has one and the default branch everywhere else.
  BRANCH: windows

  # Repositories the Windows build does not use, so checkout.sh does not clone
  # them: no libdispatch and libs-av (see install-system-domain.sh), and none
  # of the desktop components that are not built on Windows yet.
  SKIP_REPOS: >-
    swift-corelibs-libdispatch
    libs-av
    libs-steptalk
    gershwin-system
    gershwin-systempreferences
    gershwin-eau-theme
    gershwin-terminal
    gershwin-textedit
    gershwin-windowmanager
    gershwin-components
    docs
    gershwin-desktop.wiki

jobs:
  build-windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 240
    permissions:
      # The core system zip is published on the "windows-system" release.
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Git for Windows converts LF to CRLF on checkout by default, which
      # breaks every shell script and patch in the tree.
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # Only what bootstrap.sh needs to run; it installs the rest.
          install: git make

      - name: Bootstrap
        run: ./Library/Scripts/bootstrap.sh

      - name: Checkout sources
        run: ./Library/Scripts/checkout.sh

      - name: Build core libraries
        run: make corelibs

      # The core system (the patched GNUstep stack, WinUXTheme, the fonts, the
      # MinGW runtime DLLs and the fontconfig setup) is published on the
      # rolling "windows-system" release, named by the hash of everything
      # that produced it, so the CI of gershwin-workspace and the other
      # components downloads it instead of building the stack every time.
      - name: Package the core system
        run: |
          sh ./Library/Scripts/windows-bundle-runtime.sh
          ID=$(sh ./Library/Scripts/windows-system-id.sh)
          echo "$ID" > system-id.txt
          mkdir -p artifacts/system
          ( cd /System && zip -qr "$GITHUB_WORKSPACE/artifacts/system/Gershwin-System-Windows-x86_64-${ID}.zip" . )
          ls -l artifacts/system

      - name: Publish the core system
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $id = (Get-Content system-id.txt).Trim()
          $asset = "artifacts/system/Gershwin-System-Windows-x86_64-$id.zip"
          gh release view windows-system --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-system --repo $env:GITHUB_REPOSITORY --prerelease `
              --title "Windows core system (rolling)" `
              --notes "The Gershwin core system for Windows as built by the Windows CI: the patched GNUstep stack, WinUXTheme, fonts and the MinGW runtime, self-contained. One zip per identity (Library/Scripts/windows-system-id.sh); the CI of the other Gershwin repositories downloads the zip matching the gershwin-developer it builds with."
          }
          gh release upload windows-system $asset --repo $env:GITHUB_REPOSITORY --clobber

      - name: Build workspace
        run: make workspace

      # Again after the workspace: it brings DLLs of its own (libarchive),
      # and the Workspace.cmd launcher is only written once the app exists.
      - name: Bundle the runtime
        run: sh ./Library/Scripts/windows-bundle-runtime.sh

      - name: Package
        run: |
          mkdir -p artifacts/Windows/x86_64
          TIMESTAMP=$(date +%y%m%d%H%M%S)
          ( cd /System && zip -qr "$GITHUB_WORKSPACE/artifacts/Windows/x86_64/Gershwin-Windows-${TIMESTAMP}.zip" . )
          ls -l artifacts/Windows/x86_64

      - uses: actions/upload-artifact@v6
        with:
          name: gershwin-windows-x86_64
          path: artifacts/Windows/x86_64
          if-no-files-found: error
